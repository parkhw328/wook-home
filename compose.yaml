name: wook-home

services:
  office:
    build: .
    init: true
    ports:
      - "127.0.0.1:${WOOK_PORT:-8080}:8080"
    volumes:
      - office-data:/app/data
    restart: "no"
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  office-data:
