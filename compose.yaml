name: wook-home

services:
  office:
    build: .
    init: true
    environment:
      OFFICE_NAME: "${OFFICE_NAME:-StackQueue Office}"
      CODEX_BRIDGE_FILE: /app/bridge/codex.json
      CODEX_COMMANDS_DIR: /app/commands
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_WORKSPACE_ID: "${ANTHROPIC_WORKSPACE_ID:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      META_API_KEY: "${META_API_KEY:-}"
    ports:
      - "127.0.0.1:${WOOK_PORT:-8080}:8080"
    volumes:
      - office-data:/app/data
      - ./data/bridge:/app/bridge:ro
      - ./data/bridge/commands:/app/commands
    restart: "no"
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  office-data:
